<!DOCTYPE html>
<html>
<head>
    <title>QixVR</title>
    <style>
        body { margin: 0; }
        canvas { display: block; }
        #info {
            position: absolute;
            bottom: 10px;
            width: 100%;
            text-align: center;
            z-index: 100;
            display:block;
            color: white;
        }
    </style>
</head>
<body>
    <div id="info">QixVR</div>
    <canvas id="myCanvas" style="display:none;"></canvas>
    <div id="score" style="position: absolute; top: 10px; left: 10px; font-size: 24px; color: #333;"></div>
    <div id="lives" style="position: absolute; top: 40px; left: 10px; font-size: 24px; color: #333;"></div>
    <script type="module">
        // Please increase the version number by one digit each time you commit a change.
        var ver = "1.0.1";

        import * as THREE from './three/build/three.module.js';
        import { VRButton } from './three/examples/jsm/webxr/VRButton.js';
        import { XRControllerModelFactory } from './three/examples/jsm/webxr/XRControllerModelFactory.js';
        import { FontLoader } from './three/examples/jsm/loaders/FontLoader.js';
        import { TextGeometry } from './three/examples/jsm/geometries/TextGeometry.js';

        let camera, scene, renderer;

        init();
        animate();

        function init() {
            const container = document.createElement('div');
            document.body.appendChild(container);

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x505050);

            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 10);
            camera.position.set(0, 1.6, 3);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            container.appendChild(renderer.domElement);

            document.body.appendChild(VRButton.createButton(renderer));

            // controllers
            const controller1 = renderer.xr.getController(0);
            scene.add(controller1);

            const controller2 = renderer.xr.getController(1);
            scene.add(controller2);

            const controllerModelFactory = new THREE.XRControllerModelFactory();

            // Controller 1
            const controllerGrip1 = renderer.xr.getControllerGrip(0);
            controllerGrip1.add(controllerModelFactory.createControllerModel(controllerGrip1));
            scene.add(controllerGrip1);

            // Controller 2
            const controllerGrip2 = renderer.xr.getControllerGrip(1);
            controllerGrip2.add(controllerModelFactory.createControllerModel(controllerGrip2));
            scene.add(controllerGrip2);

            // Line for controllers
            const geometry = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 0, - 1)]);

            const line = new THREE.Line(geometry);
            line.name = 'line';
            line.scale.z = 5;

            controller1.add(line.clone());
            controller2.add(line.clone());

            // Game board
            const boardGeometry = new THREE.PlaneGeometry(4, 4);
            const boardMaterial = new THREE.MeshBasicMaterial({ color: 0x00ff00, side: THREE.DoubleSide });
            const board = new THREE.Mesh(boardGeometry, boardMaterial);
            board.position.set(0, 1.6, -2);
            scene.add(board);

            const loader = new FontLoader();
            loader.load('https://unpkg.com/three@0.77.0/examples/fonts/helvetiker_regular.typeface.json', function (font) {
                const textGeometry = new TextGeometry("v" + ver, {
                    font: font,
                    size: 0.1,
                    height: 0.01,
                });
                const textMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff });
                const textMesh = new THREE.Mesh(textGeometry, textMaterial);
                textMesh.position.set(-1.9, 0.2, -2);
                scene.add(textMesh);
            });

            window.addEventListener('resize', onWindowResize);

            document.getElementById("info").innerText = "v" + ver;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            renderer.setAnimationLoop(render);
        }

        function render() {
            renderer.render(scene, camera);
        }
    </script>
    <script>
        const canvas = document.getElementById('myCanvas');
        const ctx = canvas.getContext('2d');

        let borderPath = [];
        let originalBorderPath = [];
        let currentDrawnPath = [];
        let dot = {};
        let totalArea = 0;
        const keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false, Control: false };
        let isDrawing = false;
        let drawingDirection = null;
        let lastMove = { dx: 0, dy: 0 };

        // Qix variables
        const maxQixLength = 40;
        const qixUpdateFrequency = 3;
        const qixTurnChance = 50;
        var fps=30,step=10,lines=8,chc=lines/6,lw=3;
        var rb=["201","001","010","110","120","100"]; rbi=0;
        var mx,my,iii,nm=0,iii=999;
        var cd=[],rgb=[],cvs=[];
        var vt;
        let frameCount = 0;

        // Fuse variables
        let isFuseActive = false;
        let fusePosition = 0;
        const fuseSpeed = 2; // Speed of the fuse in pixels per frame
        let idleTimer = 0;
        const idleThreshold = 30; // Frames of inactivity before fuse starts (1 sec at 30fps)

        // Lives and Sparx
        let lives = 10;
        let sparx = [];

        // Invincibility
        let isInvincible = false;
        let invincibilityTimer = 0;
        const invincibilityDuration = 30; // in frames, 30fps = 1sec

        function initGame() {
            const size = Math.min(window.innerWidth, window.innerHeight) * 0.75;
            canvas.width = size;
            canvas.height = size;

            const boardSize = canvas.width * 0.75;
            const margin = (canvas.width - boardSize) / 2;
            borderPath = [
                [margin, margin],
                [margin + boardSize, margin],
                [margin + boardSize, margin + boardSize],
                [margin, margin + boardSize]
            ];
            originalBorderPath = [...borderPath];
            totalArea = calculatePolygonArea(originalBorderPath);

            lives = 10;
            sparx = [
                { edgeIndex: 0, positionOnEdge: 0, speed: 1.25, dir: 1 },
                { edgeIndex: 2, positionOnEdge: 0, speed: 1.25, dir: -1 }
            ];

            const topEdgeStart = borderPath[0];
            const topEdgeEnd = borderPath[1];
            const topEdgeLength = topEdgeEnd[0] - topEdgeStart[0];
            dot = {
                x: topEdgeStart[0] + topEdgeLength / 2,
                y: topEdgeStart[1],
                size: 5,
                speed: 4,
                onBorder: true,
                currentEdgeIndex: 0,
                positionOnEdge: topEdgeLength / 2
            };
            
            currentDrawnPath = [];
            isDrawing = false;

            isFuseActive = false;
            fusePosition = 0;
            idleTimer = 0;

            isInvincible = true;
            invincibilityTimer = Infinity; // Invincible until first move

            cd = [];
            initQix();
            updateScore();
            updateLivesDisplay();
        }

        function initQix() {
            mx = canvas.width;
            my = canvas.height;
            ctx.lineWidth=lw;
            nm = 0;
            cvs = [];
            rgb = [];
            for (let i=0;i<lines;i++){
              nm+=Math.round(255/lines);
              cvs.push(nm);
              rgb.push([ 0,0,0 ]);
            }
        }

        function drawFuse() {
            if (!isFuseActive || currentDrawnPath.length === 0) return;

            let position = fusePosition;
            let fusePoint = null;

            const fullPath = [...currentDrawnPath, [dot.x, dot.y]];

            for (let i = 0; i < fullPath.length - 1; i++) {
                const p1 = fullPath[i];
                const p2 = fullPath[i+1];
                const segmentLength = Math.hypot(p2[0] - p1[0], p2[1] - p1[1]);

                if (segmentLength > 0 && position <= segmentLength) {
                    const ratio = position / segmentLength;
                    fusePoint = [
                        p1[0] + (p2[0] - p1[0]) * ratio,
                        p1[1] + (p2[1] - p1[1]) * ratio
                    ];
                    break;
                }
                position -= segmentLength;
            }

            if (fusePoint) {
                ctx.beginPath();
                ctx.arc(fusePoint[0], fusePoint[1], 4, 0, Math.PI * 2);
                ctx.fillStyle = 'red';
                ctx.fill();
            }
        }

        function drawSparx() {
            if (lives <= 0) return;

            sparx.forEach(s => {
                const edgeStart = borderPath[s.edgeIndex];
                const edgeEnd = borderPath[(s.edgeIndex + 1) % borderPath.length];
                const edgeVec = [edgeEnd[0] - edgeStart[0], edgeEnd[1] - edgeStart[1]];
                const edgeLen = Math.hypot(edgeVec[0], edgeVec[1]);

                let x, y;
                if (edgeLen > 0) {
                    const unitVec = [edgeVec[0] / edgeLen, edgeVec[1] / edgeLen];
                    x = edgeStart[0] + unitVec[0] * s.positionOnEdge;
                    y = edgeStart[1] + unitVec[1] * s.positionOnEdge;
                } else {
                    x = edgeStart[0];
                    y = edgeStart[1];
                }

                ctx.beginPath();
                ctx.arc(x, y, 5, 0, Math.PI * 2);
                ctx.fillStyle = 'blue';
                ctx.fill();
            });
        }

        function updateFuse() {
            if (!isFuseActive) return;

            fusePosition += fuseSpeed;

            let pathLength = 0;
            if (currentDrawnPath.length > 0) {
                for (let i = 0; i < currentDrawnPath.length - 1; i++) {
                    const p1 = currentDrawnPath[i];
                    const p2 = currentDrawnPath[i+1];
                    pathLength += Math.hypot(p2[0] - p1[0], p2[1] - p1[1]);
                }
                const lastPoint = currentDrawnPath[currentDrawnPath.length - 1];
                pathLength += Math.hypot(dot.x - lastPoint[0], dot.y - lastPoint[1]);
            }

            if (pathLength > 0 && fusePosition >= pathLength) {
                handleCollision();
            }
        }

        function updateSparx() {
            if (lives <= 0) return;

            sparx.forEach(s => {
                s.positionOnEdge += s.speed * s.dir;

                while (true) {
                    let edgeStart = borderPath[s.edgeIndex];
                    let edgeEnd = borderPath[(s.edgeIndex + 1) % borderPath.length];
                    const edgeLength = Math.hypot(edgeEnd[0] - edgeStart[0], edgeEnd[1] - edgeStart[1]);

                    if (s.dir > 0) { // Clockwise
                        if (s.positionOnEdge >= edgeLength) {
                            s.positionOnEdge -= edgeLength;
                            s.edgeIndex = (s.edgeIndex + 1) % borderPath.length;
                        } else {
                            break;
                        }
                    } else { // Counter-clockwise
                        if (s.positionOnEdge < 0) {
                            s.edgeIndex = (s.edgeIndex - 1 + borderPath.length) % borderPath.length;
                            const prevEdgeLength = Math.hypot(
                                borderPath[(s.edgeIndex + 1) % borderPath.length][0] - borderPath[s.edgeIndex][0],
                                borderPath[(s.edgeIndex + 1) % borderPath.length][1] - borderPath[s.edgeIndex][1]
                            );
                            s.positionOnEdge += prevEdgeLength;
                        } else {
                            break;
                        }
                    }
                }

                // Collision with player dot
                if (dot.onBorder && s.edgeIndex === dot.currentEdgeIndex) {
                    if (Math.abs(s.positionOnEdge - dot.positionOnEdge) < dot.size) {
                        handleCollision();
                    }
                }
            });
        }

        function updateInvincibility() {
            if (isInvincible) {
                invincibilityTimer--;
                if (invincibilityTimer <= 0) {
                    isInvincible = false;
                }
            }
        }

        function handleCollision() {
            if (isInvincible) return;

            isInvincible = true;
            invincibilityTimer = invincibilityDuration;

            lives--;
            updateLivesDisplay();

            // Reset fuse state on any collision
            isFuseActive = false;
            fusePosition = 0;
            idleTimer = 0;

            if (currentDrawnPath.length > 0) {
                const startPoint = currentDrawnPath[0];
                dot.x = startPoint[0];
                dot.y = startPoint[1];

                currentDrawnPath = [];
                isDrawing = false;
                dot.onBorder = true;
                lastMove = { dx: 0, dy: 0 };
                drawingDirection = null;

                const edgeIndex = findEdgeForPoint([dot.x, dot.y], borderPath);
                if (edgeIndex !== -1) {
                    dot.currentEdgeIndex = edgeIndex;
                    const startOfEdge = borderPath[edgeIndex];
                    dot.positionOnEdge = Math.hypot(dot.x - startOfEdge[0], dot.y - startOfEdge[1]);
                } else {
                    // Fallback to the start of the border
                    dot.x = borderPath[0][0];
                    dot.y = borderPath[0][1];
                    dot.currentEdgeIndex = 0;
                    dot.positionOnEdge = 0;
                }
            }
        }

        function rand(lo,hi=1,st=0){
             if (lo=="t"){out=Math.round(Math.random()) ? -1:1;}else{out=(Math.round(Math.random()*(hi-lo)))+lo;}
             return st ? String(out):out;
        }

        function x(x){
              out=[0,0,0];
              for (let z=0;z<3;z++){
               if (x[z]=="0") { out[z]=0 }
               else if (x[z]=="1") { out[z]=cvs[lines-1] }
               else if (x[z]=="2") { out[z]=cvs[lines-1]/2 }
              }
              return out;
        }

        function updateQix(){
             iii++;
             if (iii>chc){
              iii=0;
              rbi++;
              rbi= rbi>rb.length-1 ? 0 : rbi;

              tmp=[ rb[rbi][0],rb[rbi][1],rb[rbi][2]] ;
              tmp=x(tmp);
             } else {
              tmp=[rgb[lines-1][0],rgb[lines-1][1],rgb[lines-1][2]];
             }
             rgb.shift();
             rgb.push(tmp);

             for (let i=0;i<lines;i++){

             if (i<lines-1){
              for (let it=0;it<3;it++){
               if (rgb[i][it]==0) { rgb[i][it]=0 }
               else if (rgb[i][it]<cvs[i+1]) { rgb[i][it]=cvs[i]/2 }
               else { rgb[i][it]=cvs[i] }
              }
             }

              if (cd[i]==undefined && i>0){
               cd.push([cd[i-1][0]+step,cd[i-1][1]+step,cd[i-1][2]+step,cd[i-1][3]+step]);
              }
              if (cd[i]==undefined && i==0){
                let minX = 100, minY = 100, maxX = 500, maxY = 500;
                if (borderPath.length > 0) {
                    minX = Math.min(...borderPath.map(p => p[0]));
                    maxX = Math.max(...borderPath.map(p => p[0]));
                    minY = Math.min(...borderPath.map(p => p[1]));
                    maxY = Math.max(...borderPath.map(p => p[1]));
                }
                
                let p1, p2;
                const maxLen = maxQixLength;

                do {
                    do {
                        p1 = [rand(minX, maxX), rand(minY, maxY)];
                    } while (!isPointInPolygon(p1, borderPath));
                    
                    do {
                        p2 = [rand(minX, maxX), rand(minY, maxY)];
                    } while (!isPointInPolygon(p2, borderPath));
                } while (Math.hypot(p2[0] - p1[0], p2[1] - p1[1]) > maxLen);


               cd.push([p1[0], p1[1], p2[0], p2[1]]);
               vt=[rand("t"),rand("t"),rand("t"),rand("t")];
              }
              if (i==0){
               if (cd[i][0]>5 && cd[i][0]<mx-5){
                vt[0]=rand(0,qixTurnChance)!=1 ? vt[0] : vt[0]*-1;
               }
               if (cd[i][1]>5 && cd[i][1]<my-5){
                vt[1]=rand(0,qixTurnChance)!=1 ? vt[1] : vt[1]*-1;
               }
               if (cd[i][2]>5 && cd[i][2]<mx-5){
                vt[2]=rand(0,qixTurnChance)!=1 ? vt[2] : vt[2]*-1;
               }
               if (cd[i][3]>5 && cd[i][3]<my-5){
                vt[3]=rand(0,qixTurnChance)!=1 ? vt[3] : vt[3]*-1;
               }
               let next_x1 = cd[i][0]+vt[0]*step;
               let next_y1 = cd[i][1]+vt[1]*step;
               let next_x2 = cd[i][2]+vt[2]*step;
               let next_y2 = cd[i][3]+vt[3]*step;

               if (!isPointInPolygon([next_x1, next_y1], borderPath)) {
                    vt[0] *= -1;
                    vt[1] *= -1;
                    next_x1 = cd[i][0] + vt[0] * step;
                    next_y1 = cd[i][1] + vt[1] * step;
               }
               if (!isPointInPolygon([next_x2, next_y2], borderPath)) {
                    vt[2] *= -1;
                    vt[3] *= -1;
                    next_x2 = cd[i][2] + vt[2] * step;
                    next_y2 = cd[i][3] + vt[3] * step;
               }

                const maxLen = maxQixLength;
                const currentLen = Math.hypot(next_x2 - next_x1, next_y2 - next_y1);
                if (currentLen > maxLen) {
                    if (currentLen <= maxLen + 2) { // Jitter zone
                        const choice = rand(1, 3);
                        const sign_dx = Math.sign(next_x1 - next_x2);
                        const sign_dy = Math.sign(next_y1 - next_y2);

                        if (choice === 1) { // Horizontal
                            next_x2 += sign_dx * step;
                        } else if (choice === 2) { // Vertical
                            next_y2 += sign_dy * step;
                        } else { // Diagonal
                            next_x2 += sign_dx * step;
                            next_y2 += sign_dy * step;
                        }
                    } else { // Hard correction
                        const dx = next_x2 - next_x1;
                        const dy = next_y2 - next_y1;
                        const unit_dx = dx / currentLen;
                        const unit_dy = dy / currentLen;

                        next_x2 = next_x1 + unit_dx * maxLen;
                        next_y2 = next_y1 + unit_dy * maxLen;
                    }
                }

               cd.unshift([next_x1, next_y1, next_x2, next_y2]);
               cd.pop();
              }
             }
        }
        
        function drawQix() {
            for (let i=0;i<lines;i++){
              if (cd[lines-i]!=undefined){
               let r=rgb[i][0]; let g=rgb[i][1]; let b=rgb[i][2];
               ctx.strokeStyle="rgba("+r+","+g+","+b+",200)";
               ctx.beginPath(); ctx.moveTo(cd[lines-i][0],cd[lines-i][1]);
               ctx.lineTo(cd[lines-i][2],cd[lines-i][3]); ctx.stroke();
              }
            }
        }

        function checkCollisions() {
            if (!isDrawing) return;

            for (let i = 0; i < lines; i++) {
                if (cd[i] === undefined) continue;

                const qix_p1 = [cd[i][0], cd[i][1]];
                const qix_p2 = [cd[i][2], cd[i][3]];

                // Check collision with the player's dot (a small radius around the dot)
                if (isPointOnSegment([dot.x, dot.y], qix_p1, qix_p2)) {
                     handleCollision();
                     return;
                }


                // Check collision with the drawn path
                if (currentDrawnPath.length > 0) {
                    const lastPathPoint = currentDrawnPath[currentDrawnPath.length - 1];
                    if (lineSegmentsIntersect(lastPathPoint, [dot.x, dot.y], qix_p1, qix_p2)) {
                        handleCollision();
                        return;
                    }

                    for (let j = 0; j < currentDrawnPath.length - 1; j++) {
                        if (lineSegmentsIntersect(currentDrawnPath[j], currentDrawnPath[j+1], qix_p1, qix_p2)) {
                            handleCollision();
                            return;
                        }
                    }
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (originalBorderPath.length > 0) {
                ctx.strokeStyle = 'rgba(200, 200, 200, 0.5)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(originalBorderPath[0][0], originalBorderPath[0][1]);
                for(let i = 1; i < originalBorderPath.length; i++) {
                    ctx.lineTo(originalBorderPath[i][0], originalBorderPath[i][1]);
                }
                ctx.closePath();
                ctx.stroke();
            }

            ctx.fillStyle = 'skyblue';
            if (borderPath.length > 0) {
                ctx.beginPath();
                ctx.moveTo(borderPath[0][0], borderPath[0][1]);
                for(let i = 1; i < borderPath.length; i++) ctx.lineTo(borderPath[i][0], borderPath[i][1]);
                ctx.closePath();
                ctx.fill();
                ctx.strokeStyle = 'black';
                ctx.lineWidth = 2;
                ctx.stroke();
            }
            if (isDrawing && currentDrawnPath.length > 0) {
                ctx.strokeStyle = 'yellow';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(currentDrawnPath[0][0], currentDrawnPath[0][1]);
                for (let i = 1; i < currentDrawnPath.length; i++) ctx.lineTo(currentDrawnPath[i][0], currentDrawnPath[i][1]);
                ctx.lineTo(dot.x, dot.y);
                ctx.stroke();
            }
            if (dot.x) {
                ctx.beginPath();
                ctx.arc(dot.x, dot.y, dot.size, 0, Math.PI * 2);
                ctx.fillStyle = isInvincible ? 'red' : 'green';
                ctx.fill();
            }
            
            drawQix();
            drawFuse();
            drawSparx();
        }

        function isPointOnSegment(p, a, b) {
            const len_ab = Math.hypot(b[0] - a[0], b[1] - a[1]);
            if (len_ab === 0) return Math.hypot(p[0] - a[0], p[1] - a[1]) < 1;

            const cp = (p[1] - a[1]) * (b[0] - a[0]) - (p[0] - a[0]) * (b[1] - a[1]);
            if (Math.abs(cp) / len_ab > 1) return false;

            const dp = (p[0] - a[0]) * (b[0] - a[0]) + (p[1] - a[1]) * (b[1] - a[1]);
            if (dp < 0) return false;
            
            const sl_ba = len_ab ** 2;
            if (dp > sl_ba) return false;
            
            return true;
        }

        function isOnBorder(point, path) {
            for (let i = 0; i < path.length; i++) {
                if (isPointOnSegment(point, path[i], path[(i + 1) % path.length])) return true;
            }
            return false;
        }

        function findEdgeForPoint(point, polygonPath) {
            for (let i = 0; i < polygonPath.length; i++) {
                if (isPointOnSegment(point, polygonPath[i], polygonPath[(i + 1) % polygonPath.length])) return i;
            }
            return -1;
        }

        function isPointInPolygon(point, polygon) {
            if (!polygon || polygon.length === 0) return false;
            let x = point[0], y = point[1];
            let inside = false;
            for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
                let xi = polygon[i][0], yi = polygon[i][1];
                let xj = polygon[j][0], yj = polygon[j][1];
                let intersect = ((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi);
                if (intersect) inside = !inside;
            }
            return inside;
        }

        function lineSegmentsIntersect(p1, q1, p2, q2) {
            function onSegment(p, q, r) {
                if (q[0] <= Math.max(p[0], r[0]) && q[0] >= Math.min(p[0], r[0]) &&
                    q[1] <= Math.max(p[1], r[1]) && q[1] >= Math.min(p[1], r[1])) {
                    return true;
                }
                return false;
            }

            function orientation(p, q, r) {
                const val = (q[1] - p[1]) * (r[0] - q[0]) - (q[0] - p[0]) * (r[1] - q[1]);
                if (val == 0) return 0; // Collinear
                return (val > 0) ? 1 : 2; // Clockwise or Counterclockwise
            }

            const o1 = orientation(p1, q1, p2);
            const o2 = orientation(p1, q1, q2);
            const o3 = orientation(p2, q2, p1);
            const o4 = orientation(p2, q2, q1);

            if (o1 !== o2 && o3 !== o4) {
                return true;
            }

            // Special Cases for collinear points
            if (o1 === 0 && onSegment(p1, p2, q1)) return true;
            if (o2 === 0 && onSegment(p1, q2, q1)) return true;
            if (o3 === 0 && onSegment(p2, p1, q2)) return true;
            if (o4 === 0 && onSegment(p2, q1, q2)) return true;

            return false;
        }

        function segmentsIntersect(p1, p2, p3, p4) {
            const isMoveVertical = p1.x === p2.x;
            const isPathVertical = p3.x === p4.x;
            if (isMoveVertical && !isPathVertical) {
                const isCrossingX = p1.x >= Math.min(p3.x, p4.x) && p1.x <= Math.max(p3.x, p4.x);
                const isCrossingY = p3.y >= Math.min(p1.y, p2.y) && p3.y <= Math.max(p1.y, p2.y);
                return isCrossingX && isCrossingY;
            } else if (!isMoveVertical && isPathVertical) {
                const isCrossingX = p3.x >= Math.min(p1.x, p2.x) && p3.x <= Math.max(p1.x, p2.x);
                const isCrossingY = p1.y >= Math.min(p3.y, p4.y) && p1.y <= Math.max(p3.y, p4.y);
                return isCrossingX && isCrossingY;
            }
            return false;
        }

        function calculatePolygonArea(polygon) {
            let area = 0;
            for (let i = 0; i < polygon.length; i++) {
                const p1 = polygon[i];
                const p2 = polygon[(i + 1) % polygon.length];
                area += (p1[0] * p2[1]) - (p2[0] * p1[1]);
            }
            return Math.abs(area / 2);
        }

        function normalizeWindingOrder(polygon) {
            let area = 0;
            for (let i = 0; i < polygon.length; i++) {
                const p1 = polygon[i];
                const p2 = polygon[(i + 1) % polygon.length];
                area += (p1[0] * p2[1]) - (p2[0] * p1[1]);
            }
            if (area > 0) { polygon.reverse(); }
            return polygon;
        }

        function getPointOnPath(edgeIndex, positionOnEdge, path) {
            const edgeStart = path[edgeIndex];
            const edgeEnd = path[(edgeIndex + 1) % path.length];
            const edgeVec = [edgeEnd[0] - edgeStart[0], edgeEnd[1] - edgeStart[1]];
            const edgeLen = Math.hypot(edgeVec[0], edgeVec[1]);

            if (edgeLen > 0) {
                const unitVec = [edgeVec[0] / edgeLen, edgeVec[1] / edgeLen];
                const x = edgeStart[0] + unitVec[0] * positionOnEdge;
                const y = edgeStart[1] + unitVec[1] * positionOnEdge;
                return [x, y];
            } else {
                return [edgeStart[0], edgeStart[1]];
            }
        }

        function findClosestPointOnPath(point, path) {
            let closestPointInfo = {
                distance: Infinity,
                edgeIndex: -1,
                positionOnEdge: 0
            };

            for (let i = 0; i < path.length; i++) {
                const p1 = path[i];
                const p2 = path[(i + 1) % path.length];
                const dx = p2[0] - p1[0];
                const dy = p2[1] - p1[1];
                const lenSq = dx * dx + dy * dy;

                let t = 0;
                if (lenSq !== 0) {
                    t = ((point[0] - p1[0]) * dx + (point[1] - p1[1]) * dy) / lenSq;
                    t = Math.max(0, Math.min(1, t));
                }

                const closestPointOnSegment = [p1[0] + t * dx, p1[1] + t * dy];
                const distSq = (point[0] - closestPointOnSegment[0])**2 + (point[1] - closestPointOnSegment[1])**2;

                if (distSq < closestPointInfo.distance) {
                    closestPointInfo = {
                        distance: distSq,
                        edgeIndex: i,
                        positionOnEdge: t * Math.sqrt(lenSq)
                    };
                }
            }
            return { edgeIndex: closestPointInfo.edgeIndex, positionOnEdge: closestPointInfo.positionOnEdge };
        }

        function updateScore() {
            const currentArea = calculatePolygonArea(borderPath);
            const percentage = (currentArea / totalArea) * 100;
            document.getElementById('score').innerText = `Area Left: ${percentage.toFixed(2)}%`;
        }

        function updateLivesDisplay() {
            document.getElementById('lives').innerText = `Lives: ${lives}`;
        }

        function handleAreaCapture(path) {
            if (path.length < 2) return;

            const oldSparxPositions = sparx.map(s => getPointOnPath(s.edgeIndex, s.positionOnEdge, borderPath));

            const startPoint = path[0];
            const endPoint = path[path.length - 1];
            let startEdgeIdx = findEdgeForPoint(startPoint, borderPath);
            let endEdgeIdx = findEdgeForPoint(endPoint, borderPath);

            if (startEdgeIdx === -1 || endEdgeIdx === -1) { currentDrawnPath = []; return; }

            let polygon1, polygon2;

            if (startEdgeIdx === endEdgeIdx) {
                const edgeV1 = borderPath[startEdgeIdx];
                const dist1 = Math.hypot(startPoint[0] - edgeV1[0], startPoint[1] - edgeV1[1]);
                const dist2 = Math.hypot(endPoint[0] - edgeV1[0], endPoint[1] - edgeV1[1]);
                if (dist1 > dist2) { path = path.reverse(); }

                polygon1 = [...path];
                polygon2 = [...borderPath];
                polygon2.splice(startEdgeIdx + 1, 0, ...path);
            } else {
                const p1 = [], p2 = [];
                let i = (startEdgeIdx + 1) % borderPath.length;
                while (i !== (endEdgeIdx + 1) % borderPath.length) {
                    p1.push(borderPath[i]); i = (i + 1) % borderPath.length;
                }
                p1.push(...[...path].reverse());

                i = (endEdgeIdx + 1) % borderPath.length;
                while (i !== (startEdgeIdx + 1) % borderPath.length) {
                    p2.push(borderPath[i]); i = (i + 1) % borderPath.length;
                }
                p2.push(...path);
                polygon1 = p1;
                polygon2 = p2;
            }

            normalizeWindingOrder(polygon1);
            normalizeWindingOrder(polygon2);

            const qixMidpoint = [(cd[0][0] + cd[0][2]) / 2, (cd[0][1] + cd[0][3]) / 2];
            borderPath = isPointInPolygon(qixMidpoint, polygon1) ? polygon1 : polygon2;

            sparx.forEach((s, i) => {
                const oldPos = oldSparxPositions[i];
                if (!isOnBorder(oldPos, borderPath)) {
                    // Was on a removed segment. Move to start of drawn line.
                    const newPos = findClosestPointOnPath(startPoint, borderPath);
                    s.edgeIndex = newPos.edgeIndex;
                    s.positionOnEdge = newPos.positionOnEdge;
                } else {
                    // Still on the border. Snap to the closest point to maintain consistency.
                    const newPos = findClosestPointOnPath(oldPos, borderPath);
                    s.edgeIndex = newPos.edgeIndex;
                    s.positionOnEdge = newPos.positionOnEdge;
                }
            });

            currentDrawnPath = [];
            updateScore();

            dot.x = endPoint[0];
            dot.y = endPoint[1];
            dot.onBorder = true;

            const newEdgeIndex = findEdgeForPoint(endPoint, borderPath);
            if (newEdgeIndex !== -1) {
                dot.currentEdgeIndex = newEdgeIndex;
                const startOfNewEdge = borderPath[newEdgeIndex];
                dot.positionOnEdge = Math.hypot(dot.x - startOfNewEdge[0], dot.y - startOfNewEdge[1]);
            } else {
                dot.x = borderPath[0][0];
                dot.y = borderPath[0][1];
                dot.currentEdgeIndex = 0;
                dot.positionOnEdge = 0;
            }
        }

        function update() {
            frameCount++;
            if (dot.onBorder) updateBorderMode();
            else if (isDrawing) updateDrawingMode();

            updateFuse();
            updateSparx();
            updateInvincibility();

            if (frameCount % qixUpdateFrequency === 0) {
                updateQix();
            }
        }

        function updateBorderMode() {
            if (lives <= 0) return;
            if (!dot.onBorder) return;
            const edgeIndex = dot.currentEdgeIndex;
            if (edgeIndex === -1 || edgeIndex >= borderPath.length) { dot.currentEdgeIndex = 0; return; }
            const startNode = borderPath[edgeIndex];
            const endNode = borderPath[(edgeIndex + 1) % borderPath.length];
            const edgeVector = [endNode[0] - startNode[0], endNode[1] - startNode[1]];
            const edgeLength = Math.sqrt(edgeVector[0]**2 + edgeVector[1]**2);
            let move = 0;
            if (Math.abs(edgeVector[0]) > Math.abs(edgeVector[1])) {
                if (edgeVector[0] > 0) { if(keys.ArrowRight) move = dot.speed; if(keys.ArrowLeft) move = -dot.speed; }
                else { if(keys.ArrowLeft) move = dot.speed; if(keys.ArrowRight) move = -dot.speed; }
            } else {
                if (edgeVector[1] > 0) { if(keys.ArrowDown) move = dot.speed; if(keys.ArrowUp) move = -dot.speed; }
                else { if(keys.ArrowUp) move = dot.speed; if(keys.ArrowDown) move = -dot.speed; }
            }

            if (move !== 0 && invincibilityTimer === Infinity) {
                isInvincible = false;
                invincibilityTimer = 0;
            }

            dot.positionOnEdge += move;
            if (edgeLength > 0 && dot.positionOnEdge > edgeLength) {
                dot.currentEdgeIndex = (dot.currentEdgeIndex + 1) % borderPath.length;
                dot.positionOnEdge -= edgeLength;
            } else if (dot.positionOnEdge < 0) {
                dot.currentEdgeIndex = (dot.currentEdgeIndex - 1 + borderPath.length) % borderPath.length;
                const pES = borderPath[dot.currentEdgeIndex], pEE = borderPath[(dot.currentEdgeIndex + 1) % borderPath.length];
                dot.positionOnEdge += Math.sqrt((pEE[0] - pES[0])**2 + (pEE[1] - pES[1])**2);
            }
            const newEdgeStart = borderPath[dot.currentEdgeIndex], newEdgeEnd = borderPath[(dot.currentEdgeIndex + 1) % borderPath.length];
            const newEdgeVec = [newEdgeEnd[0] - newEdgeStart[0], newEdgeEnd[1] - newEdgeStart[1]];
            const newEdgeLen = Math.sqrt(newEdgeVec[0]**2 + newEdgeVec[1]**2);
            if (newEdgeLen > 0) {
                const unitVec = [newEdgeVec[0] / newEdgeLen, newEdgeVec[1] / newEdgeLen];
                dot.x = newEdgeStart[0] + unitVec[0] * dot.positionOnEdge;
                dot.y = newEdgeStart[1] + unitVec[1] * dot.positionOnEdge;
            }
            if (keys.Control) {
                let dx = 0, dy = 0;
                if (keys.ArrowUp) { dy = -dot.speed; }
                else if (keys.ArrowDown) { dy = dot.speed; }
                else if (keys.ArrowLeft) { dx = -dot.speed; }
                else if (keys.ArrowRight) { dx = dot.speed; }
                if (dx !== 0 || dy !== 0) {
                    const testPoint = [dot.x + dx, dot.y + dy];
                    if (isPointInPolygon(testPoint, borderPath) && !isOnBorder(testPoint, borderPath)) {
                        isDrawing = true; dot.onBorder = false; drawingDirection = (dx !== 0) ? 'horizontal' : 'vertical';
                        lastMove = { dx, dy }; currentDrawnPath.push([dot.x, dot.y]);

                        isInvincible = false;
                        invincibilityTimer = 0;

                        dot.x += dx; dot.y += dy;
                    }
                }
            }
        }

        function updateDrawingMode() {
            if (lives <= 0) return;
            checkCollisions();
            if (!isDrawing) return; // Collision might have occurred

            let dx = 0, dy = 0;
            if (keys.ArrowUp) { dy = -dot.speed; } else if (keys.ArrowDown) { dy = dot.speed; }
            else if (keys.ArrowLeft) { dx = -dot.speed; } else if (keys.ArrowRight) { dx = dot.speed; }

            if (dx === 0 && dy === 0) {
                // Player is idle, start the fuse timer
                idleTimer++;
                if (idleTimer > idleThreshold) {
                    isFuseActive = true;
                }
                return; // No movement, so skip the rest
            } else {
                // Player is moving, reset fuse
                idleTimer = 0;
                isFuseActive = false;
                fusePosition = 0;
            }

            if (dx === -lastMove.dx && dy === -lastMove.dy) return;
            const moveFrom = { x: dot.x, y: dot.y }, moveTo = { x: dot.x + dx, y: dot.y + dy };
            if (currentDrawnPath.length >= 3) {
                for (let i = 0; i < currentDrawnPath.length - 2; i++) {
                    if (segmentsIntersect(moveFrom, moveTo, {x:currentDrawnPath[i][0], y:currentDrawnPath[i][1]}, {x:currentDrawnPath[i+1][0], y:currentDrawnPath[i+1][1]})) return;
                }
            }
            const newMovementDirection = (dx !== 0) ? 'horizontal' : 'vertical';
            if (drawingDirection !== null && newMovementDirection !== drawingDirection) {
                currentDrawnPath.push([dot.x, dot.y]);
            }
            drawingDirection = newMovementDirection;

            const p1 = [dot.x, dot.y];
            const p2 = [dot.x + dx, dot.y + dy];
            let hasHitBorder = false;

            for (let i = 0; i < borderPath.length; i++) {
                const b1 = borderPath[i];
                const b2 = borderPath[(i + 1) % borderPath.length];
                if (lineSegmentsIntersect(p1, p2, b1, b2)) {
                    // Snap to border
                    if (dx !== 0) { // Horizontal move, hits vertical border
                        dot.x = b1[0];
                    } else { // Vertical move, hits horizontal border
                        dot.y = b1[1];
                    }

                    isDrawing = false;
                    dot.onBorder = true;
                    lastMove = { dx: 0, dy: 0 };
                    currentDrawnPath.push([dot.x, dot.y]);
                    handleAreaCapture(currentDrawnPath);
                    hasHitBorder = true;
                    break;
                }
            }

            if (!hasHitBorder) {
                // Only move if the destination is inside the polygon
                if (isPointInPolygon(p2, borderPath)) {
                    dot.x = p2[0];
                    dot.y = p2[1];
                    lastMove = { dx, dy };
                }
            }
        }

        function gameLoop() { update(); draw(); requestAnimationFrame(gameLoop); }
        
        window.addEventListener('resize', initGame);
        document.addEventListener('keydown', (event) => { if (event.key in keys) { keys[event.key] = true; event.preventDefault();} });
        document.addEventListener('keyup', (event) => { if (event.key in keys) { keys[event.key] = false; event.preventDefault();} });
        
        initGame();
        gameLoop();
    </script>
</body>
</html>
